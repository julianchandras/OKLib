test_trace_prefix=org.apache.hadoop.hbase.io.hfile.TestHFileBlockIndex@testBlockIndexWithOffHeapBuffer
verify_test_package=org.apache.hadoop.hbase.io.hfile
#The unpatched half needs RefCnt.detector public or the patched test class cannot run there;
#see conf/samples/hbase-patches/hbase-28890-refcnt-visibility.patch (no-op on the patched checkout).
