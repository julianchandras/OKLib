#Required (user-specific):
user_root=~
system_dir_path=${user_root}/hbase/
ticket_collection_path=${ok_dir}/conf/samples/hb-collections

#Required (customized rule-related):
time_window_length_in_millis=5000
gentrace_instrument_mode=strict-selective
verify_survivor_mode=false

#Required (system related):
test_classes_dir_path="${system_dir_path}/hbase-server/target/test-classes/"
system_package_prefix=org.apache.hadoop.hbase.
test_class_name_regex=Test.*

compile_test_cmd="(git apply ${ok_dir}/conf/samples/hb-patches/HBASE-27671.patch || true) && mvn clean package -DskipTests -Dmaven.javadoc.skip=true -pl hbase-annotations,hbase-testing-util,hbase-common,hbase-client,hbase-server,hbase-zookeeper,hbase-protocol-shaded,hbase-procedure,hbase-hadoop-compat,hbase-hadoop2-compat,hbase-metrics,hbase-metrics-api,hbase-asyncfs,hbase-http,hbase-mapreduce,hbase-assembly,hbase-replication -am"

#Optional (testing-use):
verify_abort_after_three_test=false
force_instrument_nothing=false
force_track_no_states=true
force_disable_prod_checking=false
force_disable_enqueue_events=false
dump_suppress_inv_list_when_checking=false

#Optional:
instrument_state_fields=
instrument_class_allmethods=org.apache.hadoop.hbase.master.cleaner.SnapshotCleanerChore,org.apache.hadoop.hbase.master.procedure.CloneSnapshotProcedure,org.apache.hadoop.hbase.master.procedure.RestoreSnapshotProcedure
exclude_class_list=org.apache.hadoop.hbase.io.asyncfs,org.apache.hadoop.hbase.ipc,org.apache.hadoop.hbase.zookeeper,org.apache.hbase.thirdparty.io.netty,org.apache.hadoop.hbase.shaded.,org.apache.hadoop.hbase.regionserver.wal.FSHLog,org.apache.hadoop.hbase.zookeeper.MiniZooKeeperCluster,org.apache.hadoop.hbase.ChoreService,org.apache.hadoop.hbase.StartMiniClusterOption,org.apache.hadoop.hbase.HBaseTestingUtility,org.apache.hadoop.hbase.StartMiniClusterOption$Builder,org.apache.hadoop.hbase.HTableDescriptor,org.apache.hadoop.hbase.wal.DefaultWALProvider,org.apache.hadoop.hbase.regionserver.KeyValueSkipListSet,org.apache.hadoop.hbase.regionserver.DefaultMemStore,org.apache.hadoop.hbase.regionserver.ScanWildcardColumnTracker,org.apache.hadoop.hbase.regionserver.StoreFileScanner,org.apache.hadoop.hbase.regionserver.HStore,org.apache.hadoop.hbase.regionserver.KeyValueHeap,org.apache.hadoop.hbase.coprocessor.,com.google.protobuf.,org.apache.hadoop.hbase.client.,org.apache.hadoop.hbase.snapshot.

##in case you only want to run certain test classes, leave empty means run all
#specified_test_class_list=org.apache.hadoop.hbase.client.TestSnapshotWithTTLFromClient
##mark some test methods to be incapable to generate templates, these will still run but will not dump templates and will not counted in ratio
#excluded_test_method_list=
