#Required (user-specific):
user_root=~
system_dir_path=/localtmp/julian/hbase/
ticket_collection_path=${ok_dir}/conf/samples/hb-collections

#Required (customized rule-related):
time_window_length_in_millis=5000
gentrace_instrument_mode=relaxed-selective
verify_survivor_mode=false

#Required (system related):
test_classes_dir_path="${system_dir_path}/hbase-server/target/test-classes/"
system_package_prefix=org.apache.hadoop.hbase.
test_class_name_regex=Test.*

#Optional (testing-use):
verify_abort_after_three_test=false
force_instrument_nothing=false
force_track_no_states=false
force_disable_prod_checking=false
force_disable_enqueue_events=false
dump_suppress_inv_list_when_checking=false

#Optional:
instrument_state_fields=org.apache.hadoop.hbase.io.HalfStoreFileReader.closed^.get\(\),org.apache.hadoop.hbase.io.HalfStoreFileReader.top,org.apache.hadoop.hbase.io.hfile.HFileBlockIndex$BlockIndexWriter.cacheConf^.getBlockCache\(\).isPresent\(\)
instrument_class_allmethods=org.apache.hadoop.hbase.io.hfile.HFileBlockIndex$BlockIndexWriter,org.apache.hadoop.hbase.io.hfile.HFileBlock,org.apache.hadoop.hbase.nio.RefCnt,org.apache.hadoop.hbase.io.HalfStoreFileReader,org.apache.hadoop.hbase.io.hfile.HFileReaderImpl$HFileScannerImpl,org.apache.hadoop.hbase.io.hfile.BlockCache,org.apache.hadoop.hbase.io.hfile.CacheConfig,org.apache.hadoop.hbase.io.hfile.LruBlockCache,org.apache.hadoop.hbase.io.hfile.bucket.BucketCache
#exclusions trimmed 2026-09-16: dropped 5 entries whose classes no longer exist (HLogFactory,
#HTableDescriptor, DefaultWALProvider, KeyValueSkipListSet, ScanWildcardColumnTracker) and 3 read-path
#classes we want traced (StoreFileScanner, HStore/HStoreFile, KeyValueHeap). Kept: WAL/harness/chore noise.
exclude_class_list=org.apache.hadoop.hbase.regionserver.wal.FSHLog,org.apache.hadoop.hbase.zookeeper.MiniZooKeeperCluster,org.apache.hadoop.hbase.ChoreService,org.apache.hadoop.hbase.StartMiniClusterOption,org.apache.hadoop.hbase.HBaseTestingUtility,org.apache.hadoop.hbase.StartMiniClusterOption$Builder,org.apache.hadoop.hbase.regionserver.DefaultMemStore

##in case you only want to run certain test classes, leave empty means run all
#specified_test_class_list=
##mark some test methods to be incapable to generate templates, these will still run but will not dump templates and will not counted in ratio
#excluded_test_method_list=
single_command_heap_size=8g
single_command_timeout_threshold=8h
