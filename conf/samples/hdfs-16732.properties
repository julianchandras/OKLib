#Required (user-specific):
system_dir_path=/localtmp/julian/hadoop/
ticket_collection_path=${ok_dir}/conf/samples/hdfs-collections

#Required (customized rule-related):
time_window_length_in_millis=5000
gentrace_instrument_mode=relaxed-selective
verify_survivor_mode=false

#Required (system related):
#java_class_path shall be defined in individual tickets!
test_classes_dir_path=${system_dir_path}/hadoop-hdfs-project/hadoop-hdfs/target/test-classes/
system_package_prefix=org.apache.hadoop
test_class_name_regex=Test.*

#Optional (testing-use):
verify_abort_after_three_test=false
force_instrument_nothing=false
force_track_no_states=true
force_disable_prod_checking=false
force_disable_enqueue_events=false
dump_suppress_inv_list_when_checking=false

#Optional:
# instrument_state_fields=org.apache.hadoop.hdfs.server.namenode.FSNamesystem.haContext^.getState\(\).getServiceState\(\).ordinal\(\),org.apache.hadoop.hdfs.server.namenode.FSNamesystem.haEnabled^,org.apache.hadoop.hdfs.server.namenode.ha.ObserverReadProxyProvider.observerReadEnabled^,org.apache.hadoop.hdfs.server.namenode.ha.ObserverReadProxyProvider.currentIndex^,org.apache.hadoop.hdfs.server.namenode.ha.AbstractNNFailoverProxyProvider$NNProxyInfo.cachedState^.ordinal\(\),org.apache.hadoop.hdfs.protocol.LocatedBlock.locs^
instrument_state_fields=
# instrument_class_allmethods=org.apache.hadoop.ipc.ObserverRetryOnActiveException,org.apache.hadoop.hdfs.server.namenode.ha.ObserverReadProxyProvider,org.apache.hadoop.hdfs.server.namenode.FSNamesystem,org.apache.hadoop.hdfs.server.namenode.FSDirStatAndListingOp,org.apache.hadoop.hdfs.protocol.LocatedBlocks
instrument_class_allmethods=
exclude_class_list=none
