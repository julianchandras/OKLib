#Required (user-specific):
system_dir_path=/localtmp/julian/solr/
ticket_collection_path=${ok_dir}/conf/samples/solr-collections

#Required (customized rule-related):
time_window_length_in_millis=5000
#select instrumentation range: strict-selective, relaxed-selective, specified_selective, full
gentrace_instrument_mode=relaxed-selective
verify_survivor_mode=false

extra_jvm_args=-ea

test_classes_dir_path=${system_dir_path}/solr/build/solr-core/classes/test/
system_package_prefix=org.apache.solr
test_class_name_regex=Test.*\|.*Test
test_discovery_base_class=org.apache.solr.SolrTestCaseJ4
test_discovery_mode=store

#Optional (testing-use):
verify_abort_after_three_test=false
force_instrument_nothing=false
force_track_no_states=false
force_disable_prod_checking=false
force_disable_enqueue_events=false
dump_suppress_inv_list_when_checking=false

#Optional:
instrument_state_fields=none
instrument_class_allmethods=org.apache.solr.cloud.OverseerCollectionMessageHandler,org.apache.solr.cloud.rule.ReplicaAssigner,org.apache.solr.cloud.rule.Rule,org.apache.solr.cloud.rule.ImplicitSnitch,org.apache.solr.cloud.rule.SnitchContext
exclude_class_list=none

single_command_heap_size=8g
single_command_timeout_threshold=24h
