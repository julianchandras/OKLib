#Required (user-specific):
system_dir_path=/localtmp/julian/zookeeper/
ticket_collection_path=${ok_dir}/conf/samples/zk-collections

#Required (customized rule-related):
time_window_length_in_millis=5000
#(deprecated) enable_full_instrument_mode=true
#select instrumentation range: strict-selective, relaxed-selective, specified_selective, full
gentrace_instrument_mode=relaxed-selective
verify_survivor_mode=false

#Required (system related):
java_class_path="${system_dir_path}/build/classes/:${system_dir_path}/build/lib/*"
test_classes_dir_path="${system_dir_path}/build/test/classes/"
system_package_prefix=org.apache.zookeeper
test_class_name_regex=.*Test$

#Optional (testing-use):
verify_abort_after_three_test=false
force_instrument_nothing=false
force_track_no_states=false
force_disable_prod_checking=false
force_disable_enqueue_events=false
dump_suppress_inv_list_when_checking=false

#Optional:
#classes/fields from the pair's LLVerifier donor+target semantics (2026-09-16); all verified to exist at both commits
#Leader.self/zk ^.isRunning() are $3/$4 of the ZK-2687 (target) rule; Leader.java:91 `final LeaderZooKeeperServer zk`,
#:93 `final QuorumPeer self`, QuorumPeer.isRunning():1658, ZooKeeperServer.isRunning():489. learners/forwardingFollowers
#are HashSet, which the auto state pass never tracks in any mode.
instrument_state_fields=org.apache.zookeeper.server.quorum.Leader.zk^.isRunning\(\),org.apache.zookeeper.server.quorum.Leader.self^.isRunning\(\),org.apache.zookeeper.server.quorum.Leader.learners^.size\(\),org.apache.zookeeper.server.quorum.Leader.forwardingFollowers^.size\(\),org.apache.zookeeper.server.quorum.QuorumPeer.running,org.apache.zookeeper.server.ZooKeeperServer.state^.ordinal\(\)
instrument_class_allmethods=org.apache.zookeeper.server.quorum.Leader,org.apache.zookeeper.server.quorum.QuorumPeer,org.apache.zookeeper.server.quorum.LearnerHandler,org.apache.zookeeper.server.quorum.LeaderZooKeeperServer,org.apache.zookeeper.server.ZooKeeperServer
exclude_class_list=none

##in case you only want to run certain test classes, leave empty means run all
#specified_test_class_list=
##mark some test methods to be incapable to generate templates, these will still run but will not dump templates and will not counted in ratio
#excluded_test_method_list=
