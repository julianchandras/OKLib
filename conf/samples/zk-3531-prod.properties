#Production-mode config for the live ZOOKEEPER-3531 run.
#Instrumentation must cover the classes the ZK-2201 donor invariants name --
#StatPersisted (163), DataTree (93), DataNode (30) -- or nothing can activate.
#That is the union of ZK-2201's gentrace set plus the ACL cache the bug lives in.
system_dir_path=/localtmp/julian/zookeeper-3531/
ticket_collection_path=${ok_dir}/conf/samples/zk-collections-36

time_window_length_in_millis=5000
gentrace_instrument_mode=relaxed-selective
verify_survivor_mode=false

java_class_path="${system_dir_path}/zookeeper-server/target/classes/:${system_dir_path}/zookeeper-server/target/oklib-deps/*"
test_classes_dir_path="${system_dir_path}/zookeeper-server/target/test-classes/"
system_package_prefix=org.apache.zookeeper
test_class_name_regex=.*Test$

verify_abort_after_three_test=false
force_instrument_nothing=false
force_track_no_states=false
force_disable_prod_checking=false
force_disable_enqueue_events=false
dump_suppress_inv_list_when_checking=false

instrument_state_fields=
instrument_class_allmethods=org.apache.zookeeper.server.DataTree,org.apache.zookeeper.server.DataNode,org.apache.zookeeper.data.StatPersisted,org.apache.zookeeper.server.ReferenceCountedACLCache,org.apache.zookeeper.server.ZooKeeperServer,org.apache.zookeeper.server.PrepRequestProcessor,org.apache.zookeeper.server.SessionTrackerImpl,org.apache.zookeeper.server.FinalRequestProcessor,org.apache.zookeeper.server.persistence.FileTxnSnapLog
exclude_class_list=none
single_command_timeout_threshold=8h
