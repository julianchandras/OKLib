#Required (user-specific):
#NOTE: a worktree, not /localtmp/julian/zookeeper -- that repo is pinned at ZK-2201
#(71dd96a23, 2015, ant-era) and is the donor. ZK-3531 is 3.6.0-SNAPSHOT / maven.
system_dir_path=/localtmp/julian/zookeeper-3531/
ticket_collection_path=${ok_dir}/conf/samples/zk-collections

#Required (customized rule-related):
time_window_length_in_millis=5000
gentrace_instrument_mode=relaxed-selective
verify_survivor_mode=false

#Required (system related):
#java_class_path shall be defined in individual tickets!
test_classes_dir_path=${system_dir_path}/zookeeper-server/target/test-classes/
system_package_prefix=org.apache.zookeeper
test_class_name_regex=.*Test$

#Optional (testing-use):
verify_abort_after_three_test=false
force_instrument_nothing=false
force_track_no_states=false
force_disable_prod_checking=false
force_disable_enqueue_events=false
dump_suppress_inv_list_when_checking=false

#Optional:
#The bug: ReferenceCountedACLCache.serialize was `synchronized`, so a blocking
#write (socket to a stalled learner) held the ACLCache monitor and stalled every
#ACL-touching request. Track the serialization path and the cache itself.
#classes/fields from the pair's LLVerifier donor+target semantics (2026-09-16); all verified to exist at both commits
#DataTree.nodes (NodeHashMap.size()) and .ephemerals mirror the donor's states so ZK-2201 invariants
#can be active here; the donor's DataTree.longKeyMap/aclKeyMap moved into ReferenceCountedACLCache by 3.6.
instrument_state_fields=org.apache.zookeeper.server.DataTree.nodes^.size\(\),org.apache.zookeeper.server.ReferenceCountedACLCache.longKeyMap^.size\(\),org.apache.zookeeper.server.ReferenceCountedACLCache.aclKeyMap^.size\(\),org.apache.zookeeper.server.ReferenceCountedACLCache.referenceCounter^.size\(\)
instrument_class_allmethods=org.apache.zookeeper.server.DataTree,org.apache.zookeeper.server.ReferenceCountedACLCache,org.apache.zookeeper.server.DataNode,org.apache.zookeeper.server.PrepRequestProcessor,org.apache.jute.BinaryOutputArchive,org.apache.jute.BinaryInputArchive
exclude_class_list=none

##in case you only want to run certain test classes, leave empty means run all
#specified_test_class_list=
single_command_timeout_threshold=8h
