#case specific
#ZOOKEEPER-3531. Synchronization on ACLCache cause cluster to hang when
#network/disk issues happen during datatree serialization.
#Twin of ZOOKEEPER-2201 (same hang, DataNode monitor instead of ACLCache monitor).
#fix = f4c7b698bd239bcd15ee380d2ee38814dba432cd; this is its parent.
commit_id=2dcb5e799ec02a2c6a6c7bad80c47169dc095271
test_name=org.apache.zookeeper.server.DataTreeTest
test_trace_prefix=org.apache.zookeeper.server.DataTreeTest@testSerializeDoesntLockACLCacheWhileWriting
verify_test_package=org.apache.zookeeper.server

compile_test_cmd="mvn -U clean package -DskipTests -Dmaven.javadoc.skip=true -Drat.skip=true -Dcheckstyle.skip=true -Dspotbugs.skip=true -pl zookeeper-jute,zookeeper-server -am && \
mvn dependency:copy-dependencies -DincludeScope=test -DexcludeGroupIds=org.apache.zookeeper \
-DoutputDirectory=${system_dir_path}/zookeeper-server/target/oklib-deps -pl zookeeper-server"

java_class_path="\
${system_dir_path}/zookeeper-server/target/classes/:\
${system_dir_path}/zookeeper-server/target/test-classes/:\
${system_dir_path}/zookeeper-jute/target/classes/:\
${system_dir_path}/zookeeper-server/target/oklib-deps/*"
