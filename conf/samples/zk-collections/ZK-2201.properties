#case specific
#ZOOKEEPER-2201. Network issues can cause cluster to hang due to near-deadlock.
#DataTree.serializeNode synchronizes on the DataNode then writes it to a socket,
#so a vanished peer hangs the leader's request processor chain.
#Donor for ZOOKEEPER-3531, which is the same hang on the ACLCache monitor.
commit_id=71dd96a232cb590e90601fde4bfafcd4eef1f82a
test_name=org.apache.zookeeper.server.DataTreeTest
test_trace_prefix=org.apache.zookeeper.server.DataTreeTest@testSerializeDoesntLockDataNodeWhileWriting
verify_test_package=org.apache.zookeeper.server

#zk-3.6.1.properties uses "ant clean compile-test"; kept, so the build is
#reproduced rather than reused. But checkout() runs clean_state (git reset --hard)
#first, which reverts the http->https fixes for Maven Central and ivy that the
#2015 build needs (Central dropped plain HTTP in 2020) -- and `ant clean` wipes
#build/lib, so ivy must re-resolve. Re-apply the patch before building.
compile_test_cmd="(git apply ${ok_dir}/conf/samples/zk-patches/zk-2201-https.patch || true) && ant clean compile-test"
